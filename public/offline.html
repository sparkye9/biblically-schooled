<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Biblically Schooled</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #fef3f2 0%, #fef9f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1f2937;
      padding: 1rem;
    }
    .container {
      max-width: 500px;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: #fca5a5;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .action {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .primary {
      background: #dc2626;
      color: white;
    }
    .primary:hover {
      background: #b91c1c;
    }
    .secondary {
      background: white;
      color: #1f2937;
      border: 1px solid #e5e7eb;
    }
    .secondary:hover {
      background: #f9fafb;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>
      This page isn't cached yet. Check your internet connection and try again, or go back to a page you've already visited.
    </p>
    <div class="action">
      <button class="primary" onclick="location.reload()">Retry</button>
      <button class="secondary" onclick="history.back()">Go back</button>
    </div>
  </div>
</body>
</html>
